name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  INNO_SETUP_VERSION: "6.7.1"
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  release:
    name: Build Windows x64 release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Validate tag and derive version
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $pattern = '^v(?<core>(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*))(?:-(?<pre>[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$'

          if ($tag -notmatch $pattern) {
            throw "Tag '$tag' ist keine unterstützte Semantic-Version (erwartet: v1.2.3 oder v1.2.3-beta.1)."
          }

          $coreVersion = $Matches.core
          $prereleaseLabel = $Matches.pre

          if (-not [string]::IsNullOrWhiteSpace($prereleaseLabel)) {
            foreach ($identifier in $prereleaseLabel.Split('.')) {
              if ($identifier -match '^\d+$' -and $identifier.Length -gt 1 -and $identifier.StartsWith('0')) {
                throw "Numerische Prerelease-Bezeichner dürfen keine führende Null enthalten: '$identifier'."
              }
            }
          }

          $version = $tag.Substring(1)
          $numericVersion = "$coreVersion.0"
          $isPrerelease = -not [string]::IsNullOrWhiteSpace($prereleaseLabel)

          Add-Content -Path $env:GITHUB_ENV -Value "APP_VERSION=$version"
          Add-Content -Path $env:GITHUB_ENV -Value "NUMERIC_VERSION=$numericVersion"
          Add-Content -Path $env:GITHUB_ENV -Value "IS_PRERELEASE=$($isPrerelease.ToString().ToLowerInvariant())"

      - name: Restore dependencies
        run: dotnet restore LageFreeze.sln

      - name: Build and run automated tests
        run: dotnet test LageFreeze.sln --configuration Release --no-restore -p:ContinuousIntegrationBuild=true --logger "trx;LogFileName=release-test-results.trx" --results-directory TestResults

      - name: Verify tests were discovered
        shell: pwsh
        run: |
          [xml]$results = Get-Content -LiteralPath "TestResults\release-test-results.trx" -Raw
          $executed = [int]$results.TestRun.ResultSummary.Counters.executed
          if ($executed -lt 1) {
            throw "Der Testlauf hat keine Tests ausgeführt."
          }

      - name: Restore Windows x64 runtime assets
        run: dotnet restore src/LageFreeze/LageFreeze.csproj --runtime win-x64

      - name: Publish self-contained Windows x64 application
        shell: pwsh
        run: |
          $publishDirectory = Join-Path $PWD "artifacts\publish\win-x64"
          dotnet publish src/LageFreeze/LageFreeze.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output $publishDirectory -p:Version=$env:APP_VERSION -p:InformationalVersion=$env:RELEASE_TAG -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -p:ContinuousIntegrationBuild=true

          $executable = Join-Path $publishDirectory "LageFreeze.exe"
          if (-not (Test-Path -LiteralPath $executable)) {
            throw "Die erwartete Publish-Ausgabe '$executable' fehlt."
          }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $publishDirectory = Join-Path $PWD "artifacts\publish\win-x64"
          $artifactDirectory = Join-Path $PWD "artifacts"
          $zipPath = Join-Path $artifactDirectory "LageFreeze-Portable-x64.zip"

          Compress-Archive -Path "$publishDirectory\*" -DestinationPath $zipPath -CompressionLevel Optimal -Force

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          choco upgrade innosetup --version $env:INNO_SETUP_VERSION --yes --no-progress --allow-downgrade
          $validExitCodes = @(0, 1641, 3010)
          if ($validExitCodes -notcontains $LASTEXITCODE) {
            throw "Inno Setup $env:INNO_SETUP_VERSION konnte nicht installiert werden."
          }

          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "ISCC.exe wurde nach der Installation nicht gefunden."
          }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          $publishDirectory = Join-Path $PWD "artifacts\publish\win-x64"
          $artifactDirectory = Join-Path $PWD "artifacts"

          & $iscc "/DMyAppVersion=$env:APP_VERSION" "/DMyAppNumericVersion=$env:NUMERIC_VERSION" "/DPublishDir=$publishDirectory" "/DOutputDir=$artifactDirectory" "installer\LageFreeze.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Der Inno-Setup-Build ist fehlgeschlagen."
          }

          $installer = Join-Path $artifactDirectory "LageFreeze-Setup-x64.exe"
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Der erwartete Installer '$installer' fehlt."
          }

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          $artifactDirectory = Join-Path $PWD "artifacts"
          $assets = @(
            (Join-Path $artifactDirectory "LageFreeze-Portable-x64.zip"),
            (Join-Path $artifactDirectory "LageFreeze-Setup-x64.exe")
          )

          $checksumLines = $assets |
            ForEach-Object { Get-FileHash -LiteralPath $_ -Algorithm SHA256 } |
            Sort-Object Path |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $(Split-Path -Leaf $_.Path)" }

          $checksumPath = Join-Path $artifactDirectory "SHA256SUMS.txt"
          $checksumLines | Set-Content -LiteralPath $checksumPath -Encoding utf8NoBOM

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: LageFreeze-${{ github.ref_name }}-win-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/LageFreeze-Setup-x64.exe
            artifacts/LageFreeze-Portable-x64.zip
            artifacts/SHA256SUMS.txt

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $assets = @(
            "artifacts/LageFreeze-Setup-x64.exe",
            "artifacts/LageFreeze-Portable-x64.zip",
            "artifacts/SHA256SUMS.txt"
          )

          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Die Release-Artefakte konnten nicht aktualisiert werden."
            }
            exit 0
          }

          $arguments = @(
            "release", "create", $tag,
            "--verify-tag",
            "--title", "LageFreeze $tag",
            "--generate-notes",
            "--notes", "Für normale Windows-Systeme bitte **LageFreeze-Setup-x64.exe** verwenden. Die SHA-256-Prüfsummen stehen in **SHA256SUMS.txt**. Die Vorabversion ist noch nicht digital signiert; Windows kann deshalb einen SmartScreen-Hinweis anzeigen."
          )

          if ($env:IS_PRERELEASE -eq "true") {
            $arguments += "--prerelease"
          }

          $arguments += $assets
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Das GitHub Release konnte nicht erstellt werden."
          }
